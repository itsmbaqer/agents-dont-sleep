name: release

# Builds every platform into a draft GitHub release. Runs when the version workflow finishes a
# Version Packages merge (workflow_call), or when you push a tag like v0.1.0 by hand.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to create and release, e.g. v0.2.0
        type: string
        required: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          # Oldest supported glibc, so the .deb/.rpm/.AppImage run on more distros.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The pushed tag, or (from the version workflow) the commit being released.
          ref: ${{ inputs.tag && github.sha || github.ref }}

      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # beforeBuildCommand builds the adshook sidecar for --target (TAURI_ENV_TARGET_TRIPLE).
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional macOS signing + notarization: add these repository secrets and uncomment.
          # Without them the app is ad-hoc signed and users confirm it once (see README).
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Agents Don't Sleep ${{ inputs.tag || github.ref_name }}"
          releaseBody: |
            Install steps for each OS are in the [README](https://github.com/itsmbaqer/agents-dont-sleep#install). What changed: [CHANGELOG](https://github.com/itsmbaqer/agents-dont-sleep/blob/main/CHANGELOG.md).

            These builds are not code-signed yet:
            - **macOS:** on first launch, go to System Settings → Privacy & Security → Open Anyway.
            - **Windows:** at the SmartScreen prompt, click More info → Run anyway.
          releaseDraft: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          uploadUpdaterJson: false
          args: --target ${{ matrix.target }}
